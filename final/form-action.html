<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Osahon Okoro">
    <meta name="description" content="Form submission results for Smart Aquaculture Monitoring project">

    <title>Form Submission | Smart Aquaculture</title>

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
</head>

<body>
    <header>
        <div class="header-content">
            <h1 class="site-title">Smart Aquaculture</h1>
            <nav class="navigation" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="dashboard.html">Live Dashboard</a></li>
                    <li><a href="methodology.html">Methodology</a></li>
                    <li><a href="attributions.html">Attributions</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="form-results">
            <h2>Form Submission Results</h2>
            <p>Thank you for your request. Below are the details you submitted:</p>

            <ul>
                <li><strong>Name:</strong> <span id="resultName"></span></li>
                <li><strong>Email:</strong> <span id="resultEmail"></span></li>
                <li><strong>Area of Interest:</strong> <span id="resultInterest"></span></li>
                <li><strong>Message:</strong> <span id="resultMessage"></span></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Smart Aquaculture Monitoring | WDD 231 Project</p>
        <p><a href="https://youtube.com/youtube_demo_video" target="_blank" rel="noopener">Video Demo</a></p>
    </footer>

    <!-- JavaScript to display query string values -->
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById("resultName").textContent = params.get("name");
        document.getElementById("resultEmail").textContent = params.get("email");
        document.getElementById("resultInterest").textContent = params.get("interest");
        document.getElementById("resultMessage").textContent = params.get("message");
    </script>
</body>

</html>
