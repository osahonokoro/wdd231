<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Osahon Okoro">
    <meta name="description" content="Live aquaculture monitoring dashboard with real-time sensor data">

    <!-- SEO & Social Sharing -->
    <title>Live Dashboard | Smart Aquaculture</title>
    <meta property="og:title" content="Smart Aquaculture Live Dashboard">
    <meta property="og:description"
        content="Real-time aquaculture monitoring with IoT sensors and predictive analytics.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/dashboard-preview.webp">
    <meta property="og:url" content="https://osahonokoro.github.io/wdd231/final/dashboard.html">

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-content">
            <h1 class="site-title">Smart Aquaculture</h1>
            <button class="hamburger" aria-label="Toggle navigation">☰</button>
            <nav class="navigation" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="dashboard.html" aria-current="page">Live Dashboard</a></li>
                    <li><a href="methodology.html">Methodology</a></li>
                    <li><a href="attributions.html">Attributions</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- Dashboard Header -->
        <section class="dashboard-header">
            <h2>Live Monitoring Dashboard</h2>
            <div class="controls">
                <button id="themeToggle" class="control-btn">Toggle Theme</button>
                <button id="refreshData" class="control-btn">Refresh Data</button>
            </div>
        </section>

        <!-- Current Readings -->
        <section class="current-readings">
            <h3>Current Sensor Values</h3>
            <div id="currentValues" class="current-values" aria-live="polite">
                <!-- Dynamically updated -->
            </div>
        </section>

        <!-- Sensor Data History -->
        <section class="sensor-data">
            <h3>Sensor Readings History</h3>
            <div class="filters">
                <form id="filterForm">
                    <label for="parameterFilter" class="visually-hidden">Filter by parameter</label>
                    <select id="parameterFilter">
                        <option value="all">All Parameters</option>
                        <option value="temperature">Temperature</option>
                        <option value="ph">pH</option>
                        <option value="ammonia">Ammonia</option>
                        <option value="dissolved_oxygen">Dissolved Oxygen</option>
                    </select>
                    <button type="submit">Apply Filter</button>
                </form>
            </div>

            <div id="sensorReadings" class="readings-grid">
                <!-- 15+ items dynamically loaded -->
            </div>
        </section>
    </main>

    <!-- Modal Dialog -->
    <div id="readingModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalBody">
        <div class="modal-content">
            <button class="close-btn" aria-label="Close modal">&times;</button>
            <div id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Smart Aquaculture Monitoring | WDD 231 Project</p>
        <p>
            <a href="https://youtube.com/myvideo-demo" target="_blank" rel="noopener">Video Demo</a>
        </p>
    </footer>

    <!-- JavaScript Modules -->
    <script type="module" src="js/dashboard.js"></script>
</body>

</html>
